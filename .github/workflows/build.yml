# Builds the Windows exes. On main every push becomes a numbered GitHub Release, the same way as the
# EhViewer fork (tiger-git2022/ehviewer-onedrive, .github/workflows/build.yml):
#
# Version scheme: tag "v<package.json version>-t<N>", e.g. v0.1.0-t3. N starts at 1 for every base
# version and grows with each release of it. The in-app updater compares versions the same way
# (src/version.js). Runs on other branches (workflow_dispatch) only build and test.
name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even if this commit has already been released'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every push waits for the runs before it, so each gets its own release and build numbers never collide.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The release notes list the commits since the previous release
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          FORCE: ${{ inputs.force }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v*-t*' | head -n 1)
          if [ "$PUBLISH" = "true" ] && [ -n "$existing" ] && [ "$FORCE" != "true" ]; then
            echo "Commit ${GITHUB_SHA::7} was already released as $existing, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base=$(node -p "require('./package.json').version.split('-')[0]")
          last=$(git tag --list "v${base}-t*" | sed -E 's/^v.*-t//' | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          build=$(( ${last:-0} + 1 ))
          version="${base}-t${build}"
          {
            echo "skip=false"
            echo "publish=$PUBLISH"
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
          echo "Version v$version (publish: $PUBLISH)"

      - name: Setup Node
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: npm test

      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The app reports this version, and the updater compares it with the latest release
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npx electron-builder --win portable nsis --publish never
          ls -lh dist/*.exe

      - name: Upload exes
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WhaleUsage-${{ steps.version.outputs.tag }}
          path: dist/*.exe

      # Notes are Chinese first, then English: commit titles are written as "中文 / English".
      - name: Write release notes
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 --match 'v*-t*' HEAD 2>/dev/null || true)
          if [ -n "$previous" ]; then
            commits=$(git rev-list --first-parent "$previous..HEAD")
            changes=""
          else
            commits=$(git rev-list --first-parent -n 20 HEAD)
            changes="第一个编号版本，下面是最近的提交。/ First numbered release, the latest commits:"$'\n\n'
          fi
          for commit in $commits; do
            subject=$(git log -1 --format=%s "$commit")
            # A merge commit of a pull request has the pull request title as its first body line
            if [ "$(git rev-list --parents -n 1 "$commit" | wc -w)" -gt 2 ]; then
              title=$(git log -1 --format=%b "$commit" | sed -n '/./{p;q}')
              subject="${title:-$subject}"
            fi
            changes+="- $subject (${commit::7})"$'\n'
          done
          cat > release-notes.md <<EOF
          贴在 Claude 桌面 App 旁的小桌宠，显示 Claude 订阅的 5 小时和本周额度。

          ### 本次更新
          ${changes:-- 无代码改动}
          ### 下载
          - 免安装版：\`WhaleUsage-$TAG-portable.exe\`，双击运行
          - 安装版：\`WhaleUsage-$TAG-setup.exe\`

          已经在用的话，程序会自动提示更新，点「下载并更新」即可。第一次用还要在 Claude 里装 \`whale-usage-bridge\` 插件，见 [README](https://github.com/${{ github.repository }}#readme)。

          ---

          A desktop pet next to the Claude desktop app that shows your Claude subscription's 5-hour and weekly usage. The changes are listed above.

          **Download:** \`WhaleUsage-$TAG-portable.exe\` runs without installing; \`WhaleUsage-$TAG-setup.exe\` installs it. A running copy offers the update by itself. First time: also install the \`whale-usage-bridge\` plugin in Claude, see the README.
          EOF
          cat release-notes.md

      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/WhaleUsage-*.exe \
            --target "$GITHUB_SHA" \
            --title "Whale Usage $TAG" \
            --notes-file release-notes.md \
            --latest
          .github/scripts/upload-update-manifest.sh "$TAG"
